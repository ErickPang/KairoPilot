<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Dark Purple to Dark Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" /> <!-- Deep Purple -->
      <stop offset="100%" stop-color="#0F172A" /> <!-- Deep Slate -->
    </linearGradient>

    <!-- Accent Gradient 1: Cyber Blue -->
    <linearGradient id="cyberBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Accent Gradient 2: Neon Purple -->
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g transform="translate(64, 64) scale(0.75)">
    <!-- App Icon Rounded Rectangle -->
    <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

    <g filter="url(#shadow)">
      <!-- The Outer Ring (Compass / Helm) - ANIMATED -->
      <g>
        <circle cx="256" cy="256" r="140" fill="none" stroke="url(#cyberBlue)" stroke-width="16" stroke-dasharray="80 30" />
        <animateTransform 
          attributeName="transform" 
          attributeType="XML" 
          type="rotate" 
          from="0 256 256" 
          to="360 256 256" 
          dur="12s" 
          repeatCount="indefinite" />
      </g>
      
      <!-- Inner Diamond / Star (Pilot Navigation) -->
      <path d="M 256 90 L 286 226 L 422 256 L 286 286 L 256 422 L 226 286 L 90 256 L 226 226 Z" fill="url(#neonPurple)" opacity="0.9" />

      <!-- Center Core (AI Node) -->
      <circle cx="256" cy="256" r="48" fill="url(#cyberBlue)" />
      <circle cx="256" cy="256" r="24" fill="#FFFFFF" />
    </g>
  </g>
</svg>