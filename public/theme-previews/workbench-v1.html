<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KairoPilot 工作台交互原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8ebe5;color:#25342a;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #cfd5cb;background:#f7f9f4;flex-wrap:wrap}header strong{margin-right:12px}button,select{font:inherit;color:inherit;background:#fff;border:1px solid #cfd5cb;border-radius:5px;padding:6px 9px;cursor:pointer}button[aria-pressed=true]{background:#476b55;color:#fff}small{color:#687264}main{height:calc(100vh - 94px);overflow:auto;padding:16px}iframe{display:block;width:100%;height:100%;min-height:600px;margin:auto;border:1px solid #cfd5cb;border-radius:8px;background:#fafbf8}footer{padding:0 16px 8px;font-size:11px;color:#687264}
</style></head>
<body><header><strong>KairoPilot · 交互原型</strong><button data-state="empty">空态</button><button data-state="running">执行中</button><button data-state="waiting_approval">待审批</button><button data-state="completed" aria-pressed="true">已完成</button><button data-state="failed">失败</button><button data-state="paused">已暂停</button><select id="size" aria-label="窗口尺寸"><option value="fluid">跟随窗口</option><option value="1440x900">1440 × 900</option><option value="1280x800">1280 × 800</option><option value="980x720">980 × 720</option></select><select id="theme" aria-label="外观"><option value="light">浅色</option><option value="dark">深色</option></select></header><main><iframe title="工作台模拟界面" src="/?workbench-preview=completed"></iframe></main><footer>开发服务器专用 · 模拟数据 · 与正式工作台复用组件 · 不访问真实模型或工作文件</footer>
<script>
let state='completed';const frame=document.querySelector('iframe');function load(){frame.src='/?workbench-preview='+state+'&theme='+document.querySelector('#theme').value}document.querySelectorAll('[data-state]').forEach(button=>button.onclick=()=>{state=button.dataset.state;document.querySelectorAll('[data-state]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));load()});document.querySelector('#theme').onchange=load;document.querySelector('#size').onchange=event=>{const value=event.target.value;if(value==='fluid'){frame.style.width='100%';frame.style.height='100%'}else{const [width,height]=value.split('x');frame.style.width=width+'px';frame.style.height=height+'px'}};
</script></body></html>
